# PhantomWiki -> Harbor task (generated by the phantom-wiki adapter).
#
# Placeholders (__SEED__, __QID__) are substituted by the adapter when a task is stamped.
version = "1.0"

[metadata]
author_name = "PhantomWiki"
category = "reasoning-retrieval"
tags = [
  "phantom-wiki",
  "reasoning",
  "retrieval",
  "question-answering",
  "on-demand",
]
# The agent must explore /corpus and answer the question in /app/question.txt.
# Per-question `difficulty` is NOT recorded here: the stamping step does not generate the
# universe, so it does not know each question's difficulty. The verifier emits difficulty
# (and type/EM/precision/recall/F1) into /logs/verifier/result.json, and
# diagnostics/plot_difficulty.py aggregates F1 by difficulty from those files.
difficulty_explanation = "Difficulty is the PhantomWiki reasoning depth of the question (see result.json)."

[environment]
# Built from environment/Dockerfile: generates the universe (seed __SEED__), exposes only
# the article corpus + this task's question, and strips the Prolog DB and gold answers.
build_timeout_sec = 1800

[agent]
timeout_sec = 1800

[verifier]
timeout_sec = 1800
# A dedicated grading container so the gold answers never live in the agent's image.
environment_mode = "separate"

[verifier.environment]
# Built from tests/Dockerfile: regenerates the SAME universe (seed __SEED__) so it holds
# the gold answers, and ships /tests/test.sh. Harbor forwards the agent's /logs/artifacts/
# into this container, where test.sh reads /logs/artifacts/answer.txt.
build_timeout_sec = 1800
